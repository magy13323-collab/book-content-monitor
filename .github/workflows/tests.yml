name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          cache: pip
      - name: Install test and browser dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run offline corpus with real Chromium
        run: |
          New-Item -ItemType Directory -Force -Path results | Out-Null
          python -B -m pytest -q -rs -p no:cacheprovider --basetemp=results/pytest-tmp --junitxml=results/pytest.xml tests
      - name: Require zero skipped tests
        run: python -B -c "import xml.etree.ElementTree as E; r=E.parse('results/pytest.xml').getroot(); assert sum(int(s.get('skipped','0')) for s in r.iter('testsuite')) == 0, 'Skipped tests must be investigated'"
